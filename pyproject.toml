[project]
name = "stockbot"
version = "0.1.0"
description = "Personal AI Telegram Investment Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-telegram-bot==21.10",
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.13",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",
    "tenacity==9.0.0",
    "yfinance==0.2.51",
    "google-genai==1.0.0",
    "python-dotenv==1.0.1",
    "structlog==24.4.0",
    "cryptography==48.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "ruff==0.8.4",
    "mypy==1.14.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true
